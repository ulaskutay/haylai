name: Deploy RunPod Worker

on:
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "Dockerfile"
      - "rp_handler.py"
      - ".github/workflows/runpod-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ulaskutay/haylai-worker
  RUNPOD_ENDPOINT_ID: 17i71qd05h9xoi

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Update RunPod endpoint
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          if [ -z "${RUNPOD_API_KEY}" ]; then
            echo "RUNPOD_API_KEY secret not set; skipping endpoint update."
            exit 0
          fi
          curl -fsS -X POST "https://rest.runpod.io/v1/endpoints/${{ env.RUNPOD_ENDPOINT_ID }}/update" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"imageName\":\"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\"}"
