name: Deploy RunPod Worker

on:
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "Dockerfile"
      - "rp_handler.py"
      - ".github/workflows/runpod-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ulaskutay/haylai-worker
  RUNPOD_ENDPOINT_ID: pef21dmu82fn6l

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Update RunPod endpoint
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          if [ -z "${RUNPOD_API_KEY}" ]; then
            echo "RUNPOD_API_KEY secret not set; skipping endpoint update."
            exit 0
          fi
          curl -fsS -X PATCH "https://api.runpod.io/v2/serverless/${{ env.RUNPOD_ENDPOINT_ID }}" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\",\"disk\":50,\"flashboot\":\"OFF\",\"gpu\":{\"pools\":[\"AMPERE_24\",\"ADA_24\"],\"count\":1,\"allowedCudaVersions\":[\"12.4\",\"12.5\",\"12.7\",\"12.8\",\"12.9\"],\"excludedTypes\":[\"NVIDIA RTX PRO 6000 Blackwell Server Edition MIG 1g.24gb\"]},\"workers\":{\"min\":1,\"max\":1,\"idleTimeout\":120},\"scaling\":{\"type\":\"QUEUE_DELAY\",\"queueDelay\":4}}"
